services:
  relay:
    build: .
    ports:
      - "8222:8222"
    environment:
      - PORT=8222
      - AUTH_TOKEN=${AUTH_TOKEN:?set AUTH_TOKEN before starting the relay (see docs/operations.md)}
      - APPS_DIR=/apps
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPS_HOST_DIR:-./apps}:/apps
      - ${SSH_DIR:-/root/.ssh}:/root/.ssh:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Reap orphaned git/docker grandchildren (see docs/operations.md). The image
    # already runs tini as its entrypoint; this keeps compose installs covered
    # if the entrypoint is ever overridden.
    init: true
